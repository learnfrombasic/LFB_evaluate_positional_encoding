project:
  name: "Learn From Basics - LFB"
  task: "classification"
  dataset: "nyu-mll/glue"
  dataset_config: "sst2"
  text_column: "sentence"
  label_column: "label"

model:
  vocab_size: 30522
  hidden_size: 256
  num_hidden_layers: 2
  num_attention_heads: 4
  intermediate_size: 1024
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 64
  type_vocab_size: 2
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12
  num_labels: 2

  # Overridden per-run by scripts/run_pe_classification_experiments.py
  position_embedding_type: "absolute"

  pad_token_id: 0
  pre_layer_norm: false

tokenizer:
  name: "bert-base-uncased"
  padding: "max_length"
  truncation: true
  max_length: 64

training:
  # 3000-row train subset / batch 16 = 188 steps/epoch -> 5 epochs = ~940 steps.
  epochs: 5
  batch_size: 16
  gradient_accumulation_steps: 1
  # Higher than MLM's 5e-5: this trains a classifier + encoder from full
  # random init (no pretrained weights to fine-tune), which needs a larger
  # LR to move off the majority-class baseline in a bounded step budget -
  # see docs/2026-09-10/classification-results-summary.md for the diagnosis.
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  seed: 18210
  eval_steps: 188 # once per epoch
  save_steps: 100000 # effectively disabled for this short run; only final/best are saved
  checkpoint_dir: "./checkpoints/experiments_classification"
  use_wandb: true
  wandb_project: "LFB-PE-Classification-Experiments"
  wandb_entity: null # defaults to the authenticated account
  wandb_run_name: "LFB-PE-Classification-Experiment"
  save_best: true
  save_last: true
  mixed_precision: true # no-op on CPU, see docs/2026-09-10/machine-eval.md
  max_steps: null # let all 5 epochs run; the driver's own SIGALRM timeout is the safety net
  resume_from: null

logging:
  level: "info"
