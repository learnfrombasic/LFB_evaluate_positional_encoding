project:
  name: "Learn From Basics - LFB"
  task: "mlm"
  dataset: "8Opt/bert-mlm-experiments-en"

model:
  vocab_size: 30522
  hidden_size: 256
  num_hidden_layers: 2
  num_attention_heads: 4
  intermediate_size: 1024
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 64
  type_vocab_size: 2
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12

  # Overridden per-run by scripts/run_pe_experiments.py
  position_embedding_type: "absolute"

  pad_token_id: 0
  pre_layer_norm: false

tokenizer:
  name: "bert-base-uncased"
  padding: "max_length"
  truncation: true
  max_length: 64

training:
  epochs: 1
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  seed: 18210
  eval_steps: 50
  save_steps: 100000 # effectively disabled for this short run; only final/best are saved
  checkpoint_dir: "./checkpoints/experiments"
  use_wandb: true
  wandb_project: "LFB-PE-Experiments"
  wandb_entity: null # defaults to the authenticated account
  wandb_run_name: "LFB-PE-Experiment"
  save_best: true
  save_last: true
  mixed_precision: true # no-op on CPU, see docs/2026-09-10/machine-eval.md
  max_steps: 100 # hard cap on optimizer steps, bounds wall-clock time per run
  resume_from: null

logging:
  level: "info"
